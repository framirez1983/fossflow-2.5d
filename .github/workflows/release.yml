name: Release

# Manual only. This workflow previously fired after a successful Pages
# deployment, which meant an ordinary push to master could transitively
# invoke semantic-release and cut a release. Releasing is now an explicit
# human decision: run this workflow from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # The `workflow_run.conclusion` guard this used to carry was left over from
    # the old workflow_run trigger. On workflow_dispatch, github.event has no
    # workflow_run object, so the condition was always false and the job never
    # ran - a manual release could not actually release. The trigger above is
    # the only gate now.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
