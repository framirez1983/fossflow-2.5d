name: Build Docker Image

# Image publishing is intentionally disabled for the FossFLOW 2.5D v1.0.0
# release-prep pass. The inherited configuration pushed to a third party's
# Docker Hub namespace using credentials that do not exist in this repository,
# which would either fail or publish this fork's image under someone else's
# account.
#
# This job still builds the image so that a Dockerfile regression is caught.
# Publishing to a registry we control (for example GHCR) is tracked as a
# follow-up and will be added deliberately, with its own credentials.

on:
  workflow_run:
    workflows: ["E2E Tests"]
    types:
      - completed
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          progress: plain
