services:
  fossflow:
    # Built from this repository rather than pulled from a published image, so
    # that `docker compose up` always runs the code in this checkout.
    build:
      context: .
      dockerfile: Dockerfile
    image: fossflow-2.5d:local
    ports:
      - 80:80
    environment:
      - NODE_ENV=production
      - ENABLE_SERVER_STORAGE=${ENABLE_SERVER_STORAGE:-true}
      - STORAGE_PATH=/data/diagrams
      - ENABLE_GIT_BACKUP=${ENABLE_GIT_BACKUP:-false}
      - HTTP_AUTH_USER=${HTTP_AUTH_USER:-}
      - HTTP_AUTH_PASSWORD=${HTTP_AUTH_PASSWORD:-}
    volumes:
      - ./diagrams:/data/diagrams
